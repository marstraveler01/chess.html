<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Chess AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reset & Base */
        body {
            overscroll-behavior: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #111827; /* gray-900 */
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Canvas */
        canvas {
            touch-action: none; /* Critical for local handling */
            border-radius: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        /* Modals - ensuring high z-index and clickability */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100; /* Highest priority */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-out;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Button Interactions */
        .btn-action:active {
            transform: scale(0.95);
            background-color: #4B5563; /* darker gray on press */
        }
    </style>
</head>
<body class="flex flex-row">

    <!-- Left: Game Area -->
    <main id="game-container" class="flex-grow relative flex items-center justify-center bg-gray-900 p-2">
        <canvas id="gameCanvas"></canvas>
    </main>

    <!-- Right: Sidebar Controls -->
    <aside class="w-24 md:w-72 flex-none bg-gray-800 border-l border-gray-700 flex flex-col justify-between shadow-2xl z-20 relative">
        
        <!-- Header -->
        <div class="p-4 text-center border-b border-gray-700">
            <div class="flex flex-col items-center justify-center gap-2">
                <i class="fas fa-chess-knight text-yellow-500 text-3xl"></i>
                <h1 class="font-bold text-gray-100 text-sm md:text-xl leading-tight">Master<br>Chess</h1>
            </div>
            <div id="status-badge" class="mt-3 bg-gray-700 text-yellow-400 text-xs md:text-sm py-1 px-2 rounded border border-yellow-600/30 font-mono transition-colors">
                White to Move
            </div>
        </div>

        <!-- Controls List -->
        <div class="flex-1 overflow-y-auto p-2 space-y-3 flex flex-col justify-center">
            
            <button type="button" onclick="game.undo()" class="btn-action w-full bg-gray-700 hover:bg-gray-600 text-white py-3 md:py-4 rounded-lg flex flex-col md:flex-row items-center justify-center md:gap-3 transition shadow-md border-b-2 border-gray-900 cursor-pointer">
                <i class="fas fa-undo text-xl md:text-lg text-blue-400"></i>
                <span class="text-[10px] md:text-base font-semibold mt-1 md:mt-0">Undo</span>
            </button>

            <button type="button" onclick="game.toggleDifficulty()" class="btn-action w-full bg-gray-700 hover:bg-gray-600 text-white py-3 md:py-4 rounded-lg flex flex-col md:flex-row items-center justify-center md:gap-3 transition shadow-md border-b-2 border-gray-900 cursor-pointer">
                <i class="fas fa-brain text-xl md:text-lg text-purple-400"></i>
                <span id="diff-label" class="text-[10px] md:text-base font-semibold mt-1 md:mt-0">AI: Medium</span>
            </button>
            
        </div>

        <!-- Footer / Reset -->
        <div class="p-3 border-t border-gray-700 bg-gray-800">
            <button type="button" onclick="game.reset()" class="btn-action w-full bg-red-900/80 hover:bg-red-800 text-red-100 py-3 rounded-lg flex flex-col md:flex-row items-center justify-center md:gap-2 transition shadow-lg cursor-pointer">
                <i class="fas fa-trash-alt text-lg"></i>
                <span class="text-[10px] md:text-sm font-bold mt-1 md:mt-0">Reset Game</span>
            </button>
        </div>
    </aside>

    <!-- ================= MODALS (Root Level) ================= -->

    <!-- Promotion Modal -->
    <div id="promotion-modal" class="modal-overlay">
        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl text-center border border-gray-600 w-64 animate-bounce-in">
            <h3 class="text-white text-lg font-bold mb-4">Promote Pawn</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="game.promote('q')" class="btn-action p-2 bg-gray-700 rounded hover:bg-gray-600 border border-gray-600">
                    <div class="text-4xl">♕</div>
                    <div class="text-xs text-gray-300 mt-1">Queen</div>
                </button>
                <button onclick="game.promote('r')" class="btn-action p-2 bg-gray-700 rounded hover:bg-gray-600 border border-gray-600">
                    <div class="text-4xl">♖</div>
                    <div class="text-xs text-gray-300 mt-1">Rook</div>
                </button>
                <button onclick="game.promote('b')" class="btn-action p-2 bg-gray-700 rounded hover:bg-gray-600 border border-gray-600">
                    <div class="text-4xl">♗</div>
                    <div class="text-xs text-gray-300 mt-1">Bishop</div>
                </button>
                <button onclick="game.promote('n')" class="btn-action p-2 bg-gray-700 rounded hover:bg-gray-600 border border-gray-600">
                    <div class="text-4xl">♘</div>
                    <div class="text-xs text-gray-300 mt-1">Knight</div>
                </button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="modal-overlay">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl text-center max-w-sm w-full border-2 border-yellow-600/50">
            <i id="gameover-icon" class="fas fa-trophy text-5xl text-yellow-500 mb-4 drop-shadow-lg"></i>
            <h2 id="gameover-title" class="text-3xl font-extrabold text-white mb-2">Victory!</h2>
            <p id="gameover-msg" class="text-gray-300 mb-8 text-lg">White Checkmates Black</p>
            <button onclick="game.reset()" class="btn-action w-full bg-gradient-to-r from-yellow-600 to-yellow-700 hover:from-yellow-500 hover:to-yellow-600 text-white py-3 rounded-full font-bold shadow-lg text-lg">
                Play Again
            </button>
        </div>
    </div>

<script>

        Object.keys(PIECE_SVGS[color]).forEach(type => {

            const svgBlob = new Blob([PIECE_SVGS[color][type]], {type: 'image/svg+xml'});

loadImages();

/**
 * ------------------------------------------------------------------
 * SMARTER AI ENGINE (PeSTO + AlphaBeta + Ordering)
 * ------------------------------------------------------------------
 */
const AI = {
    // Material Weights
    weights: { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 },
    
    // Simplified Position Tables (Midgame)
    pst: {
        p: [ [0,0,0,0,0,0,0,0], [50,50,50,50,50,50,50,50], [10,10,20,30,30,20,10,10], [5,5,10,25,25,10,5,5], [0,0,0,20,20,0,0,0], [5,-5,-10,0,0,-10,-5,5], [5,10,10,-20,-20,10,10,5], [0,0,0,0,0,0,0,0] ],
        n: [ [-50,-40,-30,-30,-30,-30,-40,-50], [-40,-20,0,0,0,0,-20,-40], [-30,0,10,15,15,10,0,-30], [-30,5,15,20,20,15,5,-30], [-30,0,15,20,20,15,0,-30], [-30,5,10,15,15,10,5,-30], [-40,-20,0,5,5,0,-20,-40], [-50,-40,-30,-30,-30,-30,-40,-50] ],
        b: [ [-20,-10,-10,-10,-10,-10,-10,-20], [-10,0,0,0,0,0,0,-10], [-10,0,5,10,10,5,0,-10], [-10,5,5,10,10,5,5,-10], [-10,0,10,10,10,10,0,-10], [-10,10,10,10,10,10,10,-10], [-10,5,0,0,0,0,5,-10], [-20,-10,-10,-10,-10,-10,-10,-20] ],
        r: [ [0,0,0,0,0,0,0,0], [5,10,10,10,10,10,10,5], [-5,0,0,0,0,0,0,-5], [-5,0,0,0,0,0,0,-5], [-5,0,0,0,0,0,0,-5], [-5,0,0,0,0,0,0,-5], [-5,0,0,0,0,0,0,-5], [0,0,0,5,5,0,0,0] ],
        q: [ [-20,-10,-10,-5,-5,-10,-10,-20], [-10,0,0,0,0,0,0,-10], [-10,0,5,5,5,5,0,-10], [-5,0,5,5,5,5,0,-5], [0,0,5,5,5,5,0,-5], [-10,5,5,5,5,5,0,-10], [-10,0,5,0,0,0,0,-10], [-20,-10,-10,-5,-5,-10,-10,-20] ],
        k: [ [-30,-40,-40,-50,-50,-40,-40,-30], [-30,-40,-40,-50,-50,-40,-40,-30], [-30,-40,-40,-50,-50,-40,-40,-30], [-30,-40,-40,-50,-50,-40,-40,-30], [-20,-30,-30,-40,-40,-30,-30,-20], [-10,-20,-20,-20,-20,-20,-20,-10], [20,20,0,0,0,0,20,20], [20,30,10,0,0,10,30,20] ]
    },

    // Evaluate Board Position
    evaluate: (chess) => {
        let score = 0;
        const board = chess.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const p = board[r][c];
                if (!p) continue;
                
                let val = AI.weights[p.type];
                // Position bonus (flip for black)
                if (AI.pst[p.type]) {
                    val += (p.color === 'w' ? AI.pst[p.type][r][c] : AI.pst[p.type][7-r][c]);
                }
                score += (p.color === 'w' ? val : -val);
            }
        }
        return score;
    },

    // Move Ordering: Captures > Checks > Rest
    getOrderedMoves: (chess) => {
        const moves = chess.moves({ verbose: true });
        return moves.sort((a, b) => {
            let scoreA = 0, scoreB = 0;
            // Captures (MVV-LVA approx)
            if (a.captured) scoreA += 10 * AI.weights[a.captured] - AI.weights[a.piece];
            if (b.captured) scoreB += 10 * AI.weights[b.captured] - AI.weights[b.piece];
            // Promotions
            if (a.promotion) scoreA += 900;
            if (b.promotion) scoreB += 900;
            return scoreB - scoreA;
        });
    },

    minimax: (chess, depth, alpha, beta, isMax) => {
        if (depth === 0 || chess.game_over()) return AI.evaluate(chess);
        
        const moves = AI.getOrderedMoves(chess);
        
        if (isMax) { // White
            let best = -Infinity;
            for (const m of moves) {
                chess.move(m);
                best = Math.max(best, AI.minimax(chess, depth - 1, alpha, beta, false));
                chess.undo();
                alpha = Math.max(alpha, best);
                if (beta <= alpha) break;
            }
            return best;
        } else { // Black
            let best = Infinity;
            for (const m of moves) {
                chess.move(m);
                best = Math.min(best, AI.minimax(chess, depth - 1, alpha, beta, true));
                chess.undo();
                beta = Math.min(beta, best);
                if (beta <= alpha) break;
            }
            return best;
        }
    },

    getBestMove: (chess, color, depth) => {
        const isMax = color === 'w';
        let bestMove = null;
        let bestVal = isMax ? -Infinity : Infinity;
        
        const moves = AI.getOrderedMoves(chess);
        
        for (const m of moves) {
            chess.move(m);
            const val = AI.minimax(chess, depth - 1, -Infinity, Infinity, !isMax);
            chess.undo();
            
            if ((isMax && val > bestVal) || (!isMax && val < bestVal)) {
                bestVal = val;
                bestMove = m;
            }
        }
        return bestMove;
    }
};

/**
 * ------------------------------------------------------------------
 * GAME CONTROLLER
 * ------------------------------------------------------------------
 */
class ChessGame {
    constructor() {
        this.chess = new Chess();
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.squareSize = 0;
        
        this.selectedSquare = null;
        this.draggedPiece = null;
        this.dragPos = {x: 0, y: 0};
        
        this.difficulty = 2; // 1=Easy (d1), 2=Med (d2), 3=Hard (d3)
        this.pendingPromotion = null;
        this.hintMove = null;
        
        this.setupEvents();
        this.resize();
        this.updateHint(); // Initial Calculation
        this.loop();
    }

    resize() {
        const container = document.getElementById('game-container');
        const size = Math.min(container.clientWidth, container.clientHeight) - 20; 
        const dpr = window.devicePixelRatio || 1;
        
        this.canvas.width = size * dpr;
        this.canvas.height = size * dpr;
        this.canvas.style.width = `${size}px`;
        this.canvas.style.height = `${size}px`;
        
        this.ctx.scale(dpr, dpr);
        this.squareSize = size / 8;
        
        this.render();
    }

    setupEvents() {
        window.addEventListener('resize', () => this.resize());

        // Canvas specific touch - only preventDefault here
        const start = (e) => {
            e.preventDefault();
            const pos = this.getPos(e);
            this.handleStart(pos);
        };
        
        // Window moves - prevent only if dragging
        const move = (e) => {
            if(this.draggedPiece) {
                e.preventDefault();
                const pos = this.getPos(e);
                this.dragPos = {x: pos.x, y: pos.y};
            }
        };

        // Window end - prevent only if dragging
        const end = (e) => {
            if (this.draggedPiece) {
                e.preventDefault();
                this.handleEnd();
            }
        };

        this.canvas.addEventListener('mousedown', start);
        this.canvas.addEventListener('touchstart', start, {passive: false});
        
        // Attach move/end to window to catch drags outside canvas
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end, {passive: false});
    }

    getPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top,
            c: Math.floor((clientX - rect.left) / this.squareSize),
            r: Math.floor((clientY - rect.top) / this.squareSize)
        };
    }

    handleStart(pos) {
        if (this.chess.game_over() || this.chess.turn() === 'b' || pos.c < 0 || pos.c > 7 || pos.r < 0 || pos.r > 7) return;

        const square = this.toAlg(pos.c, pos.r);
        const piece = this.chess.get(square);

        // Click-to-move logic
        if (this.selectedSquare && piece?.color !== 'w') {
            this.attemptMove(this.selectedSquare, square);
        }

        // Select/Drag logic
        if (piece && piece.color === 'w') {
            this.selectedSquare = square;
            this.draggedPiece = { ...piece, square };
            this.dragPos = { x: pos.x, y: pos.y };
        } else {
            if (!this.selectedSquare) this.selectedSquare = null;
        }
    }

    handleEnd() {
        if (this.draggedPiece) {
            const c = Math.floor(this.dragPos.x / this.squareSize);
            const r = Math.floor(this.dragPos.y / this.squareSize);
            if (c >= 0 && c <= 7 && r >= 0 && r <= 7) {
                const target = this.toAlg(c, r);
                if (target !== this.draggedPiece.square) {
                    this.attemptMove(this.draggedPiece.square, target);
                }
            }
            this.draggedPiece = null;
        }
    }

    attemptMove(from, to) {
        const move = this.chess.moves({ verbose: true }).find(m => m.from === from && m.to === to);
        if (move) {
            if (move.flags.includes('p')) {
                this.pendingPromotion = { from, to };
                document.getElementById('promotion-modal').classList.add('active');
                return;
            }
            this.executeMove({ from, to });
        }
    }

    promote(type) {
        if (this.pendingPromotion) {
            this.executeMove({
                from: this.pendingPromotion.from,
                to: this.pendingPromotion.to,
                promotion: type
            });
            document.getElementById('promotion-modal').classList.remove('active');
            this.pendingPromotion = null;
        }
    }

    executeMove(moveObj) {
        this.chess.move(moveObj);
        this.selectedSquare = null;
        this.checkGameOver();
        
        if (!this.chess.game_over()) {
            document.getElementById('status-badge').innerText = "AI Thinking...";
            document.getElementById('status-badge').className = "mt-3 bg-gray-700 text-white text-xs md:text-sm py-1 px-2 rounded border border-gray-600 font-mono";
            
            setTimeout(() => {
                const depth = this.difficulty === 3 ? 3 : (this.difficulty === 2 ? 2 : 1);
                const best = AI.getBestMove(this.chess, 'b', depth);
                if(best) this.chess.move(best);
                
                document.getElementById('status-badge').innerText = "White to Move";
                document.getElementById('status-badge').className = "mt-3 bg-gray-700 text-yellow-400 text-xs md:text-sm py-1 px-2 rounded border border-yellow-600/30 font-mono";
                this.checkGameOver();
                this.updateHint();
            }, 100);
        }
    }

    updateHint() {
        // Run hint calc in timeout to prevent UI freeze
        this.hintMove = null;
        setTimeout(() => {
            if(this.chess.turn() === 'w' && !this.chess.game_over()) {
                // Hint Depth: 3 provides smart tactical hints (forks/pins)
                // Use simplified ordering if slow, but 3 is usually okay on modern mobile
                this.hintMove = AI.getBestMove(this.chess, 'w', 3); 
            }
        }, 20);
    }

    checkGameOver() {
        if (this.chess.game_over()) {
            const modal = document.getElementById('gameover-modal');
            const title = document.getElementById('gameover-title');
            const msg = document.getElementById('gameover-msg');
            const icon = document.getElementById('gameover-icon');

            if (this.chess.in_checkmate()) {
                if (this.chess.turn() === 'w') {
                    title.innerText = "Defeat";
                    msg.innerText = "Black Wins by Checkmate";
                    icon.className = "fas fa-chess-king text-5xl text-gray-500 mb-4";
                } else {
                    title.innerText = "Victory!";
                    msg.innerText = "White Wins by Checkmate";
                    icon.className = "fas fa-trophy text-5xl text-yellow-500 mb-4";
                }
            } else {
                title.innerText = "Draw";
                msg.innerText = this.chess.in_stalemate() ? "Stalemate" : "Insufficient Material / Repetition";
                icon.className = "fas fa-handshake text-5xl text-blue-400 mb-4";
            }
            modal.classList.add('active');
        }
    }

    render() {
        // Clear & Background
        this.ctx.fillStyle = '#1f2937'; // bg-gray-800
        this.ctx.fillRect(0,0,this.canvas.width, this.canvas.height);

        const board = this.chess.board();

        // 1. Board Squares
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const isLight = (r + c) % 2 === 0;
                this.ctx.fillStyle = isLight ? '#eeeed2' : '#769656'; // Classic Green
                
                // Highlights
                if (this.selectedSquare === this.toAlg(c, r)) this.ctx.fillStyle = '#baca44';
                
                // Last Move
                const hist = this.chess.history({verbose:true});
                if(hist.length) {
                    const last = hist[hist.length-1];
                    if(last.from === this.toAlg(c,r) || last.to === this.toAlg(c,r)) {
                        this.ctx.fillStyle = '#f6f669';
                    }
                }
                
                // King Check
                const p = board[r][c];
                if(p && p.type === 'k' && p.color === this.chess.turn() && this.chess.in_check()) {
                    this.ctx.fillStyle = '#ff6b6b';
                }

                this.ctx.fillRect(c*this.squareSize, r*this.squareSize, this.squareSize, this.squareSize);
            }
        }

        // 2. Hint Arrow (Smart)
        if (this.hintMove && this.chess.turn() === 'w' && !this.draggedPiece) {
            this.drawArrow(this.hintMove.from, this.hintMove.to);
        }

        // 3. Legal Moves
        if (this.selectedSquare) {
            this.chess.moves({square:this.selectedSquare, verbose:true}).forEach(m => {
                const {c,r} = this.toCoord(m.to);
                const cx = c*this.squareSize + this.squareSize/2;
                const cy = r*this.squareSize + this.squareSize/2;
                this.ctx.fillStyle = 'rgba(0,0,0,0.2)';
                this.ctx.beginPath();
                if(m.flags.includes('c') || m.flags.includes('e')) {
                    this.ctx.arc(cx, cy, this.squareSize*0.4, 0, Math.PI*2);
                    this.ctx.lineWidth = 4;
                    this.ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                    this.ctx.stroke();
                } else {
                    this.ctx.arc(cx, cy, this.squareSize*0.15, 0, Math.PI*2);
                    this.ctx.fill();
                }
            });
        }

        // 4. Pieces
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const p = board[r][c];
                if (p && (!this.draggedPiece || this.draggedPiece.square !== this.toAlg(c,r))) {
                    const img = pieceImages[p.color + p.type];
                    if(img && img.complete) this.ctx.drawImage(img, c*this.squareSize, r*this.squareSize, this.squareSize, this.squareSize);
                }
            }
        }

        // 5. Dragged Piece
        if (this.draggedPiece) {
            const img = pieceImages[this.draggedPiece.color + this.draggedPiece.type];
            if(img && img.complete) {
                this.ctx.drawImage(img, this.dragPos.x - this.squareSize/2, this.dragPos.y - this.squareSize/2, this.squareSize*1.1, this.squareSize*1.1);
            }
        }
    }

    drawArrow(from, to) {
        const f = this.toCoord(from);
        const t = this.toCoord(to);
        const x1 = f.c*this.squareSize + this.squareSize/2;
        const y1 = f.r*this.squareSize + this.squareSize/2;
        const x2 = t.c*this.squareSize + this.squareSize/2;
        const y2 = t.r*this.squareSize + this.squareSize/2;

        this.ctx.beginPath();
        this.ctx.strokeStyle = 'rgba(34, 197, 94, 0.75)'; // Green-500
        this.ctx.lineWidth = this.squareSize * 0.15;
        this.ctx.lineCap = 'round';
        this.ctx.moveTo(x1,y1);
        this.ctx.lineTo(x2,y2);
        this.ctx.stroke();

        // Arrowhead
        const angle = Math.atan2(y2-y1, x2-x1);
        const head = this.squareSize*0.35;
        this.ctx.beginPath();
        this.ctx.fillStyle = 'rgba(34, 197, 94, 0.75)';
        this.ctx.moveTo(x2,y2);
        this.ctx.lineTo(x2-head*Math.cos(angle-Math.PI/6), y2-head*Math.sin(angle-Math.PI/6));
        this.ctx.lineTo(x2-head*Math.cos(angle+Math.PI/6), y2-head*Math.sin(angle+Math.PI/6));
        this.ctx.fill();
    }

    toAlg(c, r) { return String.fromCharCode(97 + c) + (8 - r); }
    toCoord(alg) { return { c: alg.charCodeAt(0) - 97, r: 8 - parseInt(alg[1]) }; }

    loop() {
        this.render();
        requestAnimationFrame(() => this.loop());
    }

    // --- Actions ---
    undo() {
        if(this.chess.history().length >= 2 && !this.chess.game_over() && this.chess.turn() === 'w') {
            this.chess.undo();
            this.chess.undo();
            this.updateHint();
        } else if (this.chess.game_over()) {
            this.chess.undo(); // undo checkmate move
            this.chess.undo(); // undo prev
            document.getElementById('gameover-modal').classList.remove('active');
            this.updateHint();
        }
    }

    reset() {
        this.chess.reset();
        document.getElementById('gameover-modal').classList.remove('active');
        document.getElementById('promotion-modal').classList.remove('active');
        this.updateHint();
    }

    toggleDifficulty() {
        this.difficulty = this.difficulty === 3 ? 1 : this.difficulty + 1;
        const l = {1:'Easy', 2:'Medium', 3:'Hard'};
        document.getElementById('diff-label').innerText = `AI: ${l[this.difficulty]}`;
    }
}

// Initialize Global Game Object
const game = new ChessGame();
</script>
